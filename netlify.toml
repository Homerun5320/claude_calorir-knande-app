# Lagom på Netlify: webbappen (dist/) och betalningens serverfunktioner (netlify/functions).
# Steg för steg, miljövariabler och testning: docs/BETALNING.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Testläget (gratis testlicenser) är tillåtet i förhandsvisningar och grenbyggen. Ett
# produktionsbygge i testläge stoppas av byggkontrollen (scripts/commerce-guard.ts) – sätt
# LAGOM_ALLOW_TEST_COMMERCE=1 för Production i Netlify om det är avsiktligt före lanseringen.
# VITE_ACCEPT_TEST_PURCHASES=1: i förhandsvisningar godtar appen licenser från köp med Stripes
# testkort även i skarpt läge. I produktionen underkänns de alltid (byggkontrollen stoppar
# flaggan där), och servern ger inga licenser för testköp i produktionen.
[context.deploy-preview.environment]
  LAGOM_ALLOW_TEST_COMMERCE = "1"
  VITE_ACCEPT_TEST_PURCHASES = "1"

[context.branch-deploy.environment]
  LAGOM_ALLOW_TEST_COMMERCE = "1"
  VITE_ACCEPT_TEST_PURCHASES = "1"

# Appen anropar /api/create-checkout, /api/verify-purchase, /api/recover-license, /api/license-revocations och /api/recipe-fetch; Stripe anropar /api/stripe-webhook.
#
# Adresserna och anropsbegränsningen (Netlify rate limiting) står i varje funktion
# (`export const config = { path, rateLimit }` i netlify/functions/*.mts) – inte här. En funktion med
# egen `path` nås bara på den adressen och inte via /.netlify/functions/<namn>, så gränserna går
# inte att kringgå. Lägg därför inga [[redirects]] för /api/ här. Se docs/BETALNING.md.
# Gränserna räknas per IP-adress (aggregateBy ['ip', 'domain'], alla planer). Netlify hoppar tyst
# över en felskriven rateLimit – formen kontrolleras i netlify/tests/netlify-toml.test.ts, och
# gränserna provas i en förhandsvisning (429 från Netlify, inte från funktionen).

# Säkerhetsheaders för hela webbplatsen.
# CSP: bara egna filer + Open Food Facts (streckkoder och produktbilder) och Livsmedelsverkets API.
# Stripe Checkout öppnas som en vanlig sidnavigering (window.location) och behöver inget undantag
# för skript eller ramar; form-action tillåter ändå checkout.stripe.com om ett formulär används.
# Hashen i script-src är temaskriptet i index.html – ändras skriptet måste hashen uppdateras
# (testet netlify/tests/netlify-toml.test.ts säger till och skriver ut den nya hashen).
# payment=(self): Google Play Billing i Play-appen (TWA) använder Payment Request API (Digital Goods) och kräver det.
# microphone=(self): röstsökningen i "Lägg till" (bara taligenkänning på enheten, src/lib/voiceSearch.ts).
# Butiksbygget (VITE_DISTRIBUTION=appstore) får samma CSP som meta-tagg i index.html (vite.config.ts),
# utan frame-ancestors och Stripe men med VITE_API_BASE i connect-src.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-L6OVhd+4Tx0rQrzOi9YoAEzRKluqtmr6bI5iJ1jVy6w='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.openfoodfacts.org; font-src 'self' data:; connect-src 'self' https://*.openfoodfacts.org https://dataportal.livsmedelsverket.se; media-src 'self' blob: mediastream:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(self), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000"

# Filer med hash i namnet ändras aldrig – cacha dem ett år.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Startsidan, service workern och manifestet ska alltid kontrolleras, så att uppdateringar når ut.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# Digital Asset Links för Google Play (TWA): måste skickas som JSON.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"
