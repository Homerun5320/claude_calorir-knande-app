# De inbyggda apparna (Capacitor): KONTROLLBYGGE av Android-appen och, när du ber om det,
# iPhone-appen. Här signeras och laddas inget upp – butiksbyggena (signerade, till Google Play och
# TestFlight) görs av release.yml eller codemagic.yaml (se docs/NATIVE.md §9). Android SDK finns
# på GitHubs Linux-maskiner och Xcode på macOS-maskinerna; lokalt behövs varken eller.
#
# Webbdelen byggs som TESTBYGGE (LAGOM_ALLOW_STORE_WITHOUT_IAP=1) – paketen härifrån får aldrig
# skickas in. Byggkontrollen kräver säljaruppgifter: lägg in dina riktiga som Variables
# (Settings → Secrets and variables → Actions → Variables); annars används testvärdena nedan.
#
# macOS-minuter räknas tio gånger i privata repon, så iPhone-bygget körs bara på begäran
# (Actions → Native-appar → Run workflow → "Bygg även iPhone-appen"). Android-kontrollen körs på
# Linux när något som påverkar appskalet ändras.
#
# iPhone-widgeten (docs/WIDGET.md §8) är av tills App Group finns i Apple-kontot, men koden
# kontrolleras ändå: logiken (ios/App/LagomWidgetTests, Swift utan Xcode) på Linux tillsammans med
# Android-kontrollen, och i iPhone-bygget även widgetmålet för sig och appen med widgeten inbäddad –
# påslagen med node scripts/ios-widget.mjs enable bara i molnets utcheckning, efter det vanliga
# appbygget.
#
# OBS: för att pusha ändringar i .github/workflows/ krävs en token med behörigheten "workflow".
name: Native-appar

on:
  workflow_dispatch:
    inputs:
      ios:
        description: Bygg även iPhone-appen (macOS – minuterna räknas tio gånger i privata repon)
        type: boolean
        default: false
  pull_request:
    # Samma lista under push – håll dem lika.
    paths:
      - android/**
      - ios/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - .nvmrc
      - vite.config.ts
      - src/native/**
      - src/lib/storePurchases.ts
      - scripts/commerce-guard.ts
      - scripts/native-config.mjs
      - scripts/check-android-16kb.mjs
      - scripts/ios-widget.mjs
      - scripts/pbxproj.mjs
      - .github/workflows/native.yml
  push:
    branches: [main]
    paths:
      - android/**
      - ios/**
      - capacitor.config.ts
      - package.json
      - package-lock.json
      - .nvmrc
      - vite.config.ts
      - src/native/**
      - src/lib/storePurchases.ts
      - scripts/commerce-guard.ts
      - scripts/native-config.mjs
      - scripts/check-android-16kb.mjs
      - scripts/ios-widget.mjs
      - scripts/pbxproj.mjs
      - .github/workflows/native.yml

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://lagom.invalid' }}
  VITE_SELLER_NAME: ${{ vars.VITE_SELLER_NAME || 'Testbygge' }}
  VITE_SELLER_ADDRESS: ${{ vars.VITE_SELLER_ADDRESS || 'Testgatan 1, 123 45 Teststad' }}
  VITE_SELLER_PHONE: ${{ vars.VITE_SELLER_PHONE || '000-000 00 00' }}
  VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL || 'ci@users.noreply.github.com' }}
  LAGOM_ALLOW_STORE_WITHOUT_IAP: '1'

jobs:
  android:
    name: Android (APK för test och AAB) + 16 KB-kontroll
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Node enligt .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Java 21 (Capacitor 8)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Installera beroenden
        run: npm ci

      - name: Webbdelen (VITE_DISTRIBUTION=play) och cap sync
        run: npm run build:android

      # :app:testDebugUnitTest kör appens egna JUnit-tester (hemskärmswidgeten,
      # android/app/src/test/java) – bara appmodulen, inte tilläggens egna tester.
      - name: Gradle – debug-APK, release-AAB (osignerad) och appens enhetstester
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug bundleRelease :app:testDebugUnitTest -PlagomVersionCode=${{ github.run_number }}

      - name: Spara testrapporten om något steg misslyckas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lagom-android-enhetstester
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: 16 KB-sidor (Google Play, Android 15+)
        run: |
          node scripts/check-android-16kb.mjs android/app/build/outputs/apk/debug/app-debug.apk
          node scripts/check-android-16kb.mjs android/app/build/outputs/bundle/release/app-release.aab

      - name: Spara test-APK:n (kan installeras på en Android-telefon för test)
        uses: actions/upload-artifact@v7
        with:
          name: lagom-android-testbygge
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Widgetens logik (datan, vad som visas och tidslinjen) är ren Foundation och kompileras med
  # swiftc även på Linux – billigt nog att köras varje gång. Samma kommando körs på macOS i
  # iPhone-bygget.
  ios-widget-logik:
    name: iPhone-widgetens logik (Swift på Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Swift finns på maskinen
        run: |
          if ! command -v swiftc > /dev/null; then
            echo "::error::swiftc saknas på GitHubs Linux-maskin (ubuntu-latest) – widgetens Swift-tester kan inte köras. Se programlistan i github.com/actions/runner-images; installera Swift i ett eget steg om den har tagits bort."
            exit 1
          fi
          swiftc --version

      - name: Widget – logiktester (swiftc)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lagom-widget-tests"
          swiftc -o "$out" \
            ios/App/LagomWidget/WidgetShared.swift \
            ios/App/LagomWidget/WidgetPayload.swift \
            ios/App/LagomWidget/WidgetContent.swift \
            ios/App/LagomWidgetTests/main.swift
          "$out" ios/App/LagomWidgetTests/fixtures

  ios:
    name: iPhone (simulatorbygge utan signering)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-26
    # Appen byggs två gånger (utan och med widgeten) plus widgetmålet för sig.
    timeout-minutes: 75
    steps:
      - name: Hämta koden
        uses: actions/checkout@v7

      - name: Node enligt .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Xcode 26 eller senare (App Store kräver iOS 26-SDK:n)
        run: |
          # Senaste stabila Xcode 26+ (betaversioner kan inte ladda upp till App Store).
          XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_2[6-9]*.app' ! -iname '*beta*' | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')"
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::error::Xcode 26 eller senare krävs (hittade $(xcodebuild -version | head -1))."
            exit 1
          fi

      - name: Installera beroenden
        run: npm ci

      - name: Webbdelen (VITE_DISTRIBUTION=appstore) och cap sync
        run: npm run build:ios

      - name: Xcode – bygg för simulatorn
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

      - name: Spara Package.resolved (checka in den, så att Swift-paketen låses)
        uses: actions/upload-artifact@v7
        with:
          name: lagom-ios-package-resolved
          path: ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: ignore
          retention-days: 14

      # iPhone-widgeten (docs/WIDGET.md §8). Stegen nedan kommer efter appbygget ovan, som alltid
      # bygger repots läge (i dag utan widgeten).
      - name: Widget – logiktester (swiftc)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lagom-widget-tests"
          swiftc -o "$out" \
            ios/App/LagomWidget/WidgetShared.swift \
            ios/App/LagomWidget/WidgetPayload.swift \
            ios/App/LagomWidget/WidgetContent.swift \
            ios/App/LagomWidgetTests/main.swift
          "$out" ios/App/LagomWidgetTests/fixtures

      - name: Widget – bygg målet för simulatorn
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -target LagomWidgetExtension -configuration Debug
          -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

      # Widgeten slås på bara i den här utcheckningen (ändringen checkas aldrig in) och appen byggs
      # om i en egen DerivedData-mapp: så syns det redan nu om appen inte går att bygga med widgeten
      # inbäddad. Webbdelen är byggd med WIDGET_IOS_READY = false – här prövas bara appskalet.
      - name: Widget påslagen – bygg appen med widgeten inbäddad
        run: |
          set -euo pipefail
          if ! node scripts/ios-widget.mjs check; then
            echo "::error::iPhone-widgeten är halvvägs påslagen (se felet ovan) – projektfilen, App.entitlements och WIDGET_IOS_READY ska vara på eller av tillsammans (docs/WIDGET.md §8)."
            exit 1
          fi
          WIDGET="$(node scripts/ios-widget.mjs status)"
          echo "iPhone-widgeten i repot: $WIDGET"
          where="Widgeten är påslagen i repot."
          if [ "$WIDGET" = "av" ]; then
            # Utskriftens lista gäller den riktiga påslagningen, inte den här körningen.
            node scripts/ios-widget.mjs enable > /dev/null
            echo "Widgeten är påslagen i den här utcheckningen (checkas aldrig in)."
            where="I repot är widgeten av – den slogs på bara i den här körningen."
          fi
          derived="$RUNNER_TEMP/lagom-widget-pa"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived" CODE_SIGNING_ALLOWED=NO build
          app="$derived/Build/Products/Debug-iphonesimulator/App.app"
          plist="$app/PlugIns/LagomWidgetExtension.appex/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "::error::Appen byggdes, men widgeten är inte inbäddad: App.app/PlugIns/LagomWidgetExtension.appex/Info.plist saknas. Kontrollera beroendet och kopieringsfasen \"Embed Foundation Extensions\" i appmålet (scripts/ios-widget.mjs)."
            exit 1
          fi
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" 2>/dev/null || true)"
          point="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$plist" 2>/dev/null || true)"
          echo "Widgeten i appen: $id ($point)"
          if [ "$id" != "se.lagomappen.lagom.widget" ]; then
            echo "::error::Widgeten har fel Bundle ID: \"$id\" (väntade se.lagomappen.lagom.widget – PRODUCT_BUNDLE_IDENTIFIER i målet LagomWidgetExtension)."
            exit 1
          fi
          if [ "$point" != "com.apple.widgetkit-extension" ]; then
            echo "::error::Widgetens NSExtension → NSExtensionPointIdentifier är \"$point\", inte com.apple.widgetkit-extension (ios/App/LagomWidget/Info.plist)."
            exit 1
          fi
          # App Store kräver samma version och byggnummer i widgeten som i appen.
          for key in CFBundleShortVersionString CFBundleVersion; do
            in_app="$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" 2>/dev/null || true)"
            in_widget="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || true)"
            if [ -z "$in_app" ] || [ "$in_app" != "$in_widget" ]; then
              echo "::error::$key skiljer sig: appen \"$in_app\", widgeten \"$in_widget\". Widgetmålet ska ha samma MARKETING_VERSION och CURRENT_PROJECT_VERSION som appen."
              exit 1
            fi
          done
          {
            echo "### iPhone-widgeten"
            echo
            echo "Appen byggdes för simulatorn med widgeten inbäddad ($id). $where"
          } >> "$GITHUB_STEP_SUMMARY"
