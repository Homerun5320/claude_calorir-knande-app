<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lagom – svensk kalori- och näringsdagbok med Livsmedelsverkets värden, streckkodsläsare, Tallriksmodellen och kostråd. Prova gratis i 14 dagar. Reklamfri och privat." />
    <meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1210" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lagom" />
    <title>Lagom – kaloriräknaren</title>
    <script>
      // Sätt tema innan första renderingen för att undvika blink.
      try {
        var t = localStorage.getItem('lagom-theme') || 'system';
        var dark = t === 'morkt' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Lagom behöver JavaScript för att fungera.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
