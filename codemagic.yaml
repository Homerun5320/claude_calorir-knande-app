# Codemagic – alternativ till .github/workflows/release.yml för signerade butiksbyggen.
#
# Gratisnivån (personligt konto): 500 byggminuter i månaden på Mac mini M2 (`mac_mini_m2` – den
# enda maskintypen utan betalning). Därför körs även Android-bygget på macOS här.
# Steg för steg: docs/IOS-BYGGE-I-MOLNET.md (Codemagic) och docs/NATIVE.md §9–10.
#
# Samma steg som i GitHub Actions: webbdelen byggs skarpt (aldrig LAGOM_ALLOW_STORE_WITHOUT_IAP,
# VITE_COMMERCE_MODE=live), signering via App Store Connect API-nyckeln respektive
# uppladdningsnyckeln, 16 KB-kontroll, och uppladdning till TestFlight respektive Google Play
# (intern test). Använd EN tjänst per app – annars laddas samma version upp två gånger.
#
# Ställs in i Codemagic (inget av det här checkas in):
#   Personal Account → Integrations → Developer Portal: API-nyckeln med namnet "Lagom"
#     (App Store Connect → Användare och åtkomst → Integrationer, rollen App Manager).
#   Personal Account → codemagic.yaml settings → Code signing identities → Android keystores:
#     uppladdningsnyckeln med referensnamnet "lagom_upload".
#   Appens Environment variables, grupper:
#     lagom_bygge  – VITE_API_BASE, VITE_COMMERCE_MODE (live), VITE_LICENSE_PUBLIC_KEYS,
#                    VITE_SELLER_NAME, VITE_SELLER_ORGNR, VITE_SELLER_ADDRESS, VITE_SELLER_PHONE,
#                    VITE_SELLER_VAT, VITE_SUPPORT_EMAIL (inte hemliga – samma som på Netlify),
#                    valfritt LAGOM_BUILD_NUMBER_OFFSET
#     app_store    – CERTIFICATE_PRIVATE_KEY (hemlig), APP_STORE_APPLE_ID (appens Apple ID, siffror),
#                    valfritt LAGOM_INTERN_TESTFLIGHT=true (bygget blir bara för intern test)
#     google_play  – GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (hemlig, tjänstekontots JSON)
#
# iPhone-widgeten (docs/WIDGET.md §8) är av tills App Group finns i Apple-kontot. Läget läses en
# gång med node scripts/ios-widget.mjs status, som i release.yml: "på" – även widgetens profil
# (se.lagomappen.lagom.widget) hämtas, och IPA:n ska innehålla widgeten med samma version och
# App Group i båda signaturerna; "av" – IPA:n får inte innehålla den. Halvvägs påslagen stoppar
# bygget.

workflows:
  ios-testflight:
    name: iPhone → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Lagom
    environment:
      groups:
        - lagom_bygge
        - app_store
      vars:
        LAGOM_APP_ID: se.lagomappen.lagom
      node: 22
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Förutsättningar (version och variabler)
        script: &preflight |
          #!/usr/bin/env bash
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          fail=0
          problem() { echo "FEL: $1"; fail=1; }
          if [ -n "${CM_TAG:-}" ] && [ "$CM_TAG" != "v$version" ]; then
            problem "Taggen $CM_TAG stämmer inte med versionen i package.json ($version)."
          fi
          for name in VITE_API_BASE VITE_SELLER_NAME VITE_SELLER_ADDRESS VITE_SELLER_PHONE VITE_SUPPORT_EMAIL; do
            if [ -z "${!name:-}" ]; then problem "Variabeln $name saknas i gruppen lagom_bygge."; fi
          done
          case "${VITE_API_BASE:-}" in ""|https://*) ;; *) problem "VITE_API_BASE måste börja med https://." ;; esac
          if [ "${VITE_COMMERCE_MODE:-}" != live ]; then
            problem "VITE_COMMERCE_MODE måste vara live i butiksbyggen – i testläge godtas osignerade testlicenser."
          fi
          if [ -z "${VITE_LICENSE_PUBLIC_KEYS:-}${VITE_LICENSE_PUBLIC_KEY:-}" ]; then
            problem "VITE_LICENSE_PUBLIC_KEYS saknas – samma publika licensnyckel som på Netlify."
          fi
          if [ -n "${LAGOM_ALLOW_STORE_WITHOUT_IAP:-}${VITE_ACCEPT_TEST_PURCHASES:-}" ]; then
            problem "LAGOM_ALLOW_STORE_WITHOUT_IAP och VITE_ACCEPT_TEST_PURCHASES får inte finnas i butiksbyggen – ta bort dem."
          fi
          if ! [[ "${LAGOM_BUILD_NUMBER_OFFSET:-0}" =~ ^[0-9]+$ ]]; then
            problem "LAGOM_BUILD_NUMBER_OFFSET måste vara ett heltal."
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "LAGOM_VERSION=$version" >> "$CM_ENV"

      # Läses en gång, innan något steg ändrar Xcode-projektet (xcode-project use-profiles skriver i
      # det), och gäller sedan för signeringen och kontrollen av IPA:n.
      - name: iPhone-widgeten – av eller på (scripts/ios-widget.mjs)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          if ! node scripts/ios-widget.mjs check; then
            echo "FEL: iPhone-widgeten är halvvägs påslagen (se felet ovan) – projektfilen, App.entitlements och WIDGET_IOS_READY ska vara på eller av tillsammans. Återställ filerna eller slå på allt med node scripts/ios-widget.mjs enable (docs/WIDGET.md §8)."
            exit 1
          fi
          WIDGET="$(node scripts/ios-widget.mjs status)"
          case "$WIDGET" in
            på|av) ;;
            *) echo "FEL: oväntat svar från node scripts/ios-widget.mjs status: \"$WIDGET\"."; exit 1 ;;
          esac
          echo "iPhone-widgeten: $WIDGET"
          echo "LAGOM_WIDGET=$WIDGET" >> "$CM_ENV"

      - name: Installera beroenden
        script: npm ci

      - name: Webbdelen (VITE_DISTRIBUTION=appstore) och cap sync
        script: npm run build:ios

      - name: Signering – distributionscertifikat och profil via App Store Connect API
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$LAGOM_APP_ID" \
            --platform IOS --type IOS_APP_STORE --strict-match-identifier --create
          if [ "$LAGOM_WIDGET" = "på" ]; then
            # Widgeten har ett eget Bundle ID och en egen profil (App Groups, ingen HealthKit) – samma
            # certifikat. use-profiles kopplar sedan varje profil till sitt mål efter Bundle ID.
            app-store-connect fetch-signing-files "$LAGOM_APP_ID.widget" \
              --platform IOS --type IOS_APP_STORE --strict-match-identifier --create
          fi
          keychain add-certificates
          if [ "${LAGOM_INTERN_TESTFLIGHT:-}" = true ]; then
            xcode-project use-profiles --project ios/App/App.xcodeproj \
              --custom-export-options '{"testFlightInternalTestingOnly": true}'
          else
            xcode-project use-profiles --project ios/App/App.xcodeproj
          fi

      - name: Byggnummer (App Store Connects senaste + 1)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          latest=""
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            latest="$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)"
          fi
          if [[ "$latest" =~ ^[0-9]+$ ]]; then
            number=$((latest + 1))
          else
            echo "Inget tidigare bygge hittades (eller APP_STORE_APPLE_ID saknas) – använder Codemagics byggnummer."
            number=$((BUILD_NUMBER + ${LAGOM_BUILD_NUMBER_OFFSET:-0}))
          fi
          echo "Byggnummer: $number"
          echo "LAGOM_BUILD_NUMBER=$number" >> "$CM_ENV"

      - name: Xcode – arkivera och exportera IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App --config Release \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$LAGOM_BUILD_NUMBER MARKETING_VERSION=$LAGOM_VERSION"

      - name: Kontrollera IPA:n (version, byggnummer och HealthKit)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          work="$(mktemp -d)"
          unzip -q "$ipa" -d "$work"
          app="$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -1)"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          echo "Version $short ($bundle)"
          [ "$short" = "$LAGOM_VERSION" ] || { echo "FEL: versionen är $short, inte $LAGOM_VERSION."; exit 1; }
          [ "$bundle" = "$LAGOM_BUILD_NUMBER" ] || { echo "FEL: byggnumret är $bundle, inte $LAGOM_BUILD_NUMBER."; exit 1; }
          entitlements="$(codesign -d --entitlements - "$app" 2>/dev/null || true)"
          if ! grep -q 'com.apple.developer.healthkit' <<< "$entitlements"; then
            echo "FEL: HealthKit saknas – slå på HealthKit för Bundle ID:t på developer.apple.com och bygg igen."
            exit 1
          fi

      - name: Kontrollera IPA:n (iPhone-widgeten)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          work="$(mktemp -d)"
          unzip -q "$ipa" -d "$work"
          app="$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -1)"
          appex="$app/PlugIns/LagomWidgetExtension.appex"
          group=group.se.lagomappen.lagom
          if [ "$LAGOM_WIDGET" = "på" ]; then
            if [ ! -d "$appex" ]; then
              echo "FEL: widgeten är påslagen, men IPA:n saknar PlugIns/LagomWidgetExtension.appex – appmålet bäddar inte in den. Kör node scripts/ios-widget.mjs check (docs/WIDGET.md §8)."
              exit 1
            fi
            plist="$appex/Info.plist"
            id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist" 2>/dev/null || true)"
            short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || true)"
            bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" 2>/dev/null || true)"
            app_short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
            app_bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
            echo "Widgeten: Bundle ID $id, version $short ($bundle)"
            if [ "$id" != "$LAGOM_APP_ID.widget" ]; then
              echo "FEL: widgeten har fel Bundle ID i IPA:n: \"$id\" (väntade $LAGOM_APP_ID.widget)."
              exit 1
            fi
            if [ "$short" != "$app_short" ] || [ "$bundle" != "$app_bundle" ]; then
              echo "FEL: widgetens version $short ($bundle) är inte appens $app_short ($app_bundle) – App Store kräver samma. Widgetmålet ska ha samma MARKETING_VERSION och CURRENT_PROJECT_VERSION som appen."
              exit 1
            fi
            # Behörigheterna i signaturerna – App Group måste finnas i båda profilerna.
            app_entitlements="$(codesign -d --entitlements - "$app" 2>/dev/null || true)"
            widget_entitlements="$(codesign -d --entitlements - "$appex" 2>/dev/null || true)"
            if ! grep -qF 'com.apple.security.application-groups' <<< "$app_entitlements" || ! grep -qF "$group" <<< "$app_entitlements"; then
              echo "FEL: App Group $group saknas i appens behörigheter – skapa gruppen på developer.apple.com (Certificates, Identifiers & Profiles → Identifiers → App Groups → +), slå på App Groups med gruppen för Bundle ID:t $LAGOM_APP_ID och bygg igen (profilen skapas då om). Se docs/WIDGET.md §8."
              exit 1
            fi
            if ! grep -qF 'com.apple.security.application-groups' <<< "$widget_entitlements" || ! grep -qF "$group" <<< "$widget_entitlements"; then
              echo "FEL: App Group $group saknas i widgetens behörigheter – skapa App ID:t $LAGOM_APP_ID.widget på developer.apple.com (Identifiers → + → App IDs → App, Explicit) med förmågan App Groups och gruppen $group, och bygg igen (profilen skapas då om). Se docs/WIDGET.md §8."
              exit 1
            fi
            echo "Med iPhone-widgeten ($id, App Group $group)."
          else
            # Av: widgeten får inte ha följt med av misstag (appens profil saknar App Group).
            if [ -e "$appex" ]; then
              echo "FEL: IPA:n innehåller PlugIns/LagomWidgetExtension.appex fast widgeten är av (node scripts/ios-widget.mjs status). Slå på den helt med node scripts/ios-widget.mjs enable, eller ta bort inbäddningen ur appmålet (docs/WIDGET.md §8)."
              exit 1
            fi
            echo "Utan iPhone-widgeten (av tills App Group finns i Apple-kontot)."
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
    publishing:
      app_store_connect:
        auth: integration
        # Bara uppladdning: interna testare får bygget när Apple har behandlat det. Externa testare
        # och inskickning till granskning görs i App Store Connect.
        submit_to_testflight: false
        submit_to_app_store: false

  android-play:
    name: Android → Google Play (intern test)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      android_signing:
        - lagom_upload
      groups:
        - lagom_bygge
        - google_play
      vars:
        LAGOM_APP_ID: se.lagomappen.lagom
      node: 22
      java: 21
    # Startas för hand (Start new build). Standardupplägget är Android i GitHub Actions
    # (release.yml, Linux-minuter räcker långt). Vill du bygga Android här vid taggar i stället:
    # ta bort kommentartecknen nedan och ta bort uppladdningsnyckeln ur GitHub.
    # triggering:
    #   events:
    #     - tag
    #   tag_patterns:
    #     - pattern: 'v*'
    #       include: true
    scripts:
      - name: Förutsättningar (version och variabler)
        script: *preflight

      - name: Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Installera beroenden
        script: npm ci

      - name: Webbdelen (VITE_DISTRIBUTION=play), Health Connect-adressen och cap sync
        script: npm run build:android

      - name: Byggnummer (Google Plays senaste + 1)
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          latest="$(google-play get-latest-build-number --package-name "$LAGOM_APP_ID" 2>/dev/null || true)"
          if [[ "$latest" =~ ^[0-9]+$ ]]; then
            number=$((latest + 1))
          else
            echo "Inget tidigare bygge hittades i Google Play – använder Codemagics byggnummer."
            number=$((BUILD_NUMBER + ${LAGOM_BUILD_NUMBER_OFFSET:-0}))
          fi
          echo "Byggnummer: $number"
          echo "LAGOM_BUILD_NUMBER=$number" >> "$CM_ENV"

      - name: Gradle – signerad release-AAB
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          # android/app/build.gradle läser uppladdningsnyckeln från LAGOM_UPLOAD_KEYSTORE*.
          export LAGOM_UPLOAD_KEYSTORE="$CM_KEYSTORE_PATH"
          export LAGOM_UPLOAD_KEYSTORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export LAGOM_UPLOAD_KEY_ALIAS="$CM_KEY_ALIAS"
          export LAGOM_UPLOAD_KEY_PASSWORD="$CM_KEY_PASSWORD"
          cd android
          ./gradlew --no-daemon bundleRelease -PlagomVersionCode="$LAGOM_BUILD_NUMBER"

      - name: Kontrollera signaturen och 16 KB-sidor
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          aab=android/app/build/outputs/bundle/release/app-release.aab
          verify="$(jarsigner -verify "$aab" 2>&1 || true)"
          if ! grep -q 'jar verified' <<< "$verify"; then
            echo "$verify"
            echo "FEL: AAB:n är inte signerad – kontrollera uppladdningsnyckeln (lagom_upload)."
            exit 1
          fi
          certs="$(keytool -printcert -jarfile "$aab")"
          echo "Uppladdningsnyckelns SHA-256: $(awk '/SHA256:/ { print $2; exit }' <<< "$certs")"
          node scripts/check-android-16kb.mjs "$aab"

    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # true om Play Console svarar "Only releases with status draft may be created on draft app"
        # (appen har aldrig släppts på något spår) – släpp sedan utkastet i Play Console.
        submit_as_draft: false
