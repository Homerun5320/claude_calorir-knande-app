<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Lagom – favicon. Förenklad variant av icon.svg, ritad på ett 32-rutnät där alla kanter
    ligger på jämna enheter så att den blir skarp både i 16 px (1 enhet = ½ px) och 32 px.
  -->
  <title>Lagom</title>
  <style>
    .bg { fill: #1f5a43 }
    @media (prefers-color-scheme: dark) {
      /* Lite ljusare grön så att ikonen syns mot mörka flikrader. */
      .bg { fill: #2a7457 }
    }
  </style>
  <defs>
    <clipPath id="sky">
      <rect width="32" height="16"/>
    </clipPath>
  </defs>
  <rect class="bg" width="32" height="32" rx="8"/>
  <circle cx="16" cy="16" r="8" fill="#f2bb34" clip-path="url(#sky)"/>
  <rect x="4" y="16" width="24" height="2" rx="1" fill="#f6f3ec"/>
  <rect x="10" y="22" width="12" height="2" rx="1" fill="#f5cf6b" opacity="0.85"/>
  <rect x="13" y="26" width="6" height="2" rx="1" fill="#f5cf6b" opacity="0.55"/>
</svg>
